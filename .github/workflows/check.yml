name: Check plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, arm64, container]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Check package and synchronization boundaries
        run: |
          python3 scripts/check-plugin.py
          python3 scripts/test-check-plugin.py
          python3 scripts/test-sync-upstream.py
          python3 scripts/test-sync-action.py
      - name: Test plugin registration
        run: bun test test/plugin.test.js
